name: CI

on:
  push:
    branches:
      - '**'       # run on all branches
  pull_request:
    branches:
      - '**'       # run on all PRs

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[test]"

    - name: Run tests
      run: |
        pytest --maxfail=2 --disable-warnings

  build-windows-check:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install pyinstaller
        python -m pip install ".[gui]"

    - name: Build CLI EXE
      run: |
        pyinstaller --onefile --name dicomexport-cli dicomexport/main.py

    - name: Build GUI EXE
      run: |
        pyinstaller --onefile --windowed --name dicomexport --add-data "dicomexport/gui/main_window.ui;dicomexport/gui" dicomexport/gui/qt_app.py

    - name: Package GUI zip (exe + res/)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path dicomexport-windows
        Copy-Item dist\dicomexport.exe dicomexport-windows\
        Copy-Item -Recurse res dicomexport-windows\res
        Compress-Archive -Path dicomexport-windows -DestinationPath dist\dicomexport-windows.zip

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install pyinstaller
        python -m pip install .

    - name: Build binary
      run: |
        pyinstaller --onefile --name dicomexport dicomexport/main.py
