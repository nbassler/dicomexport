name: Build Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # needed for setuptools-scm versioning

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install pyinstaller
        python -m pip install ".[gui]"

    - name: Build CLI EXE
      run: |
        pyinstaller --onefile --name dicomexport-cli dicomexport/main.py

    - name: Build GUI EXE
      run: |
        pyinstaller --onefile --windowed --name dicomexport --add-data "dicomexport/gui/main_window.ui;dicomexport/gui" dicomexport/gui/qt_app.py

    # defaults/ goes beside the executables, not inside them: a --onefile executable unpacks
    # bundled data into a temporary directory that is deleted on exit, and an exported TOPAS
    # includeFile would point there (issue #112).
    - name: Package zip (executables + defaults/)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path dicomexport-windows
        Copy-Item dist\dicomexport.exe dicomexport-windows\
        Copy-Item dist\dicomexport-cli.exe dicomexport-windows\
        Copy-Item -Recurse dicomexport\defaults dicomexport-windows\defaults
        Compress-Archive -Path dicomexport-windows -DestinationPath dist\dicomexport-windows.zip

    - name: Upload artifact for testing (non-release)
      if: github.event_name != 'release'
      uses: actions/upload-artifact@v7
      with:
        name: dicomexport-windows
        path: dicomexport-windows/
        retention-days: 3

    - name: Upload artifacts to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: |
          dist/dicomexport-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # needed for setuptools-scm versioning

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install pyinstaller
        python -m pip install .

    - name: Build binary
      run: |
        pyinstaller --onefile --name dicomexport dicomexport/main.py

    # defaults/ beside the binary, for the same reason as in the Windows zip. One top-level
    # folder, like the zip, so unpacking does not spill files into the current directory.
    - name: Archive Linux binary with defaults/
      run: |
        mkdir -p dicomexport-linux-x86_64
        cp dist/dicomexport dicomexport-linux-x86_64/
        cp -r dicomexport/defaults dicomexport-linux-x86_64/defaults
        tar -czf dist/dicomexport-linux-x86_64.tar.gz dicomexport-linux-x86_64

    - name: Upload artifact for testing (non-release)
      if: github.event_name != 'release'
      uses: actions/upload-artifact@v7
      with:
        name: dicomexport-linux-x86_64
        path: dicomexport-linux-x86_64/
        retention-days: 3

    - name: Upload binary to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: dist/dicomexport-linux-x86_64.tar.gz
