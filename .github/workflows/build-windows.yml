name: Build Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # needed for setuptools-scm versioning

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install pyinstaller
        python -m pip install ".[gui]"

    - name: Build CLI EXE
      run: |
        pyinstaller --onefile --name dicomexport-cli dicomexport/main.py

    - name: Build GUI EXE
      run: |
        pyinstaller --onefile --windowed --name dicomexport --add-data "dicomexport/gui/main_window.ui;dicomexport/gui" dicomexport/gui/qt_app.py

    - name: Package GUI zip (exe + res/)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path dicomexport-windows
        Copy-Item dist\dicomexport.exe dicomexport-windows\
        Copy-Item -Recurse res dicomexport-windows\res
        Compress-Archive -Path dicomexport-windows -DestinationPath dist\dicomexport-windows.zip

    - name: Upload artifact for testing (non-release)
      if: github.event_name != 'release'
      uses: actions/upload-artifact@v7
      with:
        name: dicomexport-windows
        path: dicomexport-windows/
        retention-days: 3

    - name: Upload artifacts to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: |
          dist/dicomexport-windows.zip
          dist/dicomexport-cli.exe

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # needed for setuptools-scm versioning

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install pyinstaller
        python -m pip install .

    - name: Build binary
      run: |
        pyinstaller --onefile --name dicomexport dicomexport/main.py

    - name: Archive Linux binary
      run: |
        tar -C dist -czf dist/dicomexport-linux-x86_64.tar.gz dicomexport

    - name: Upload binary to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: dist/dicomexport-linux-x86_64.tar.gz
