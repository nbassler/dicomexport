[build-system]
requires = ["setuptools>=42", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "dicomexport"
description = "Tool for exporting from Dicom RT-PLAN files."
authors = [
    { name = "Niels Bassler", email = "nbassler@users.noreply.github.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydicom>=2.3.1", "numpy", "scipy", "pandas"]
dynamic = ["version"]
# (optional)
keywords = ["dicom", "rt", "radiotherapy", "topas"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Homepage = "https://github.com/nbassler/dicomexport"
Repository = "https://github.com/nbassler/dicomexport"
Issues = "https://github.com/nbassler/dicomexport/issues"
Changelog = "https://github.com/nbassler/dicomexport/releases"
Discussions = "https://github.com/nbassler/dicomexport/discussions"

[project.optional-dependencies]
gui = ["PyQt6>=6.4.0"]
web = ["streamlit>=1.12.0"]

test = ["pytest>=7.2.1", "mcpl>=2.2.6"]

dev = ["ruff>=0.4.0", "build", "twine", "dicomexport[test]"]

# Entry points
[project.scripts]
dicomexport = "dicomexport.main:main"
dicomexport-gui = "dicomexport.gui.qt_app:main"
plan-export = "dicomexport.main_plan_export:main"
geo-export = "dicomexport.main_geo_export:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dicomexport*"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(message)s"

log_file = "pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_file_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
line-length = 127

[tool.ruff.lint]
select = ["E", "F", "W"] # pycodestyle + pyflakes, equivalent to flake8 defaults

[tool.yapf]
based_on_style = "pep8"
column_limit = 127

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
version_file = "dicomexport/__version__.py"
